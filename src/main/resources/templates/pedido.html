<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('pedido')}"></header>

<main class="page">
    <div class="order-area">
        <!-- Kiosko: Categorías → Productos → Opciones. Lo pinta order-form.js con GET /api/products. -->
        <section class="panel kiosk" aria-live="polite">
            <div class="kiosk-nav">
                <button type="button" class="btn secondary back-btn" id="kiosk-back" hidden>← Atrás</button>
                <ol class="steps" id="kiosk-steps">
                    <li data-step="categories">Categoría</li>
                    <li data-step="products">Producto</li>
                    <li data-step="options">Opciones</li>
                </ol>
            </div>
            <p id="kiosk-toast" class="alert success" hidden></p>

            <!-- Paso 1 -->
            <div class="kiosk-screen" data-screen="categories">
                <h2>¿Qué va a pedir?</h2>
                <div class="tile-grid tile-grid-big" id="category-list">
                    <p class="empty">Cargando menú…</p>
                </div>
            </div>

            <!-- Paso 2 -->
            <div class="kiosk-screen" data-screen="products" hidden>
                <h2 id="products-title">Productos</h2>
                <div class="tile-grid" id="product-list"></div>
            </div>

            <!-- Paso 3 -->
            <div class="kiosk-screen" data-screen="options" hidden>
                <h2 id="options-title">Producto</h2>

                <div class="option-group" id="size-group">
                    <h3>Tamaño</h3>
                    <div class="choice-grid" id="size-list"></div>
                </div>

                <div class="option-group" id="modifier-group">
                    <h3>Adiciones</h3>
                    <div class="choice-grid" id="modifier-list"></div>
                </div>

                <div class="option-group">
                    <h3>Cantidad</h3>
                    <div class="stepper">
                        <button type="button" class="btn secondary" id="qty-minus" aria-label="Quitar uno">−</button>
                        <output id="qty-value" aria-live="polite">1</output>
                        <button type="button" class="btn secondary" id="qty-plus" aria-label="Agregar uno">+</button>
                    </div>
                </div>

                <div class="price-preview">
                    <span id="unit-price">$0 c/u</span>
                    <strong id="line-price">$0</strong>
                </div>
                <button type="button" class="btn primary big" id="add-to-order">Agregar al pedido</button>
            </div>
        </section>

        <!-- Pedido en curso (se envía a POST /api/orders) -->
        <aside class="panel cart" id="cart" aria-labelledby="cart-title">
            <h2 id="cart-title">Pedido en curso</h2>
            <ul id="cart-items" class="cart-items"></ul>
            <p class="cart-total">Total estimado <strong id="cart-total">$0</strong></p>
            <label class="field">Nombre del cliente
                <input type="text" id="customer-name" maxlength="60" placeholder="Ej. Ana" autocomplete="off">
            </label>
            <p id="order-error" class="alert error" hidden></p>
            <button type="button" id="submit-order" class="btn primary big">Registrar pedido</button>
            <p class="hint">Al registrar se muestra el total calculado por el servidor y se puede cobrar de una vez.</p>
        </aside>
    </div>

    <!-- En celular el carrito queda abajo: este botón lleva a él -->
    <a href="#cart" class="cart-fab" id="cart-fab" hidden>🛒 Ver pedido (<span id="cart-count">0</span>)</a>
</main>

<div th:replace="~{fragments/layout :: modal}"></div>
<script th:src="@{/js/order-form.js}"></script>
</body>
</html>
