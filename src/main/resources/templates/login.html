<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>v3 · Java 8 · Café Aroma</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 22h36v16a16 16 0 0 1-16 16h-4a16 16 0 0 1-16-16z' fill='%236F4E37'/%3E%3Cpath d='M46 27h4a7 7 0 0 1 0 14h-5' fill='none' stroke='%236F4E37' stroke-width='5'/%3E%3Cpath d='M22 6c-3 4 3 6 0 10M32 6c-3 4 3 6 0 10' fill='none' stroke='%236F4E37' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
<header class="topbar">
    <h1>☕ Café Aroma</h1>
</header>

<main class="login-wrap">
    <!-- Spring Security procesa POST /login; th:action agrega el token CSRF -->
    <form class="panel login-card" method="post" th:action="@{/login}">
        <h2>Iniciar sesión</h2>
        <p class="alert error" th:if="${param.error != null}">Usuario o contraseña incorrectos.</p>
        <p class="alert success" th:if="${param.salir != null}">Sesión cerrada.</p>

        <label class="field">Usuario
            <input type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
        </label>
        <label class="field">Contraseña
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn primary">Entrar</button>
        <p class="hint">Caja entra a Tomar pedido; cocina entra a Cocina.</p>
    </form>
</main>
</body>
</html>
