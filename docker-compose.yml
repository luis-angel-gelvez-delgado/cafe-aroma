services:
  db:
    image: mysql:8.4
    container_name: cafe-aroma-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: cafe_aroma
      MYSQL_USER: cafe_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Bogota
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - cafe_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: cafe-aroma-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: cafe_aroma
      DB_USERNAME: cafe_app
      DB_PASSWORD: ${DB_PASSWORD}
      CAJA_PASSWORD: ${CAJA_PASSWORD}
      COCINA_PASSWORD: ${COCINA_PASSWORD}
      TZ: America/Bogota
    ports:
      - "8080:8080"

volumes:
  cafe_data:
